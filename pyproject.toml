[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pakground-groundwater-monitoring"
version = "0.2.0"
description = "Reproducible Pakistan-only extraction and exploratory analysis of historical groundwater observations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muzammal Hussain"}]
dependencies = ["openpyxl>=3.1,<4.0"]

[tool.setuptools]
packages = ["pakground"]
